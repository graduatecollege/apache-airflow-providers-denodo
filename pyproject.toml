[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "apache-airflow-providers-denodo"
authors = [
    { name = "Mikael Arvola", email = "marvel@illinois.edu" },
]
license-files = [
    "LICENSE", "NOTICE"
]
description = "Denodo connection for Apache Airflow."
classifiers = [
    "Framework :: Apache Airflow",
    "Framework :: Apache Airflow :: Provider",
]
dynamic = [
    "version"
]
requires-python = ">=3.12,!=3.15.*"
dependencies = [
    "apache-airflow>=3.2,<3.3",
    "denodo-sqlalchemy>=2.0.5"
]

[project.urls]
Source = "https://github.com/graduatecollege/apache-airflow-providers-denodo"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.entry-points.apache_airflow_provider]
provider_info = "airflow.providers.denodo.get_provider_info:get_provider_info"

[tool.pdm.version]
source = "scm"
version_format = "src.airflow.providers.denodo.version:format_version"
tag_filter = "v*"
tag_regex = '^v(?P<version>\d+\.\d+\.\d+)$'
write_to = "airflow/providers/denodo/_version.txt"

[tool.pdm.build]
package-dir = "src"
includes = ["src/airflow"]